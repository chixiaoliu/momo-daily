# Render 蓝图：一键部署成免费 Web 服务（不需要买服务器）
# 用法：把这个仓库推到 GitHub → render.com → New → Blueprint → 选仓库
services:
  - type: web
    name: momo-daily
    runtime: python
    plan: free
    buildCommand: "echo no build step needed"
    startCommand: "python prototype/server.py --port $PORT --no-browser --host 0.0.0.0"
    healthCheckPath: /api/state
    envVars:
      # 公网模式：每个访客用自己的 Token，站长配置不生效
      - key: MOMO_PUBLIC
        value: "1"
      # 允许 Cloudflare Pages 上的前端跨域调用（换成你的 pages.dev 域名更安全）
      - key: MOMO_CORS
        value: "*"
      - key: PYTHON_VERSION
        value: "3.11.9"
