name: daily-article

# 每天 07:00（北京时间）自动生成当天文章并发布到 GitHub Pages
# 23:00 UTC = 次日 07:00 北京
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-article
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成今天的文章
        env:
          MAIMEMO_TOKEN: ${{ secrets.MAIMEMO_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: https://api.deepseek.com/v1
          LLM_MODEL: deepseek-chat
          MOMO_MODE: single
          MOMO_LEVEL: B1 (CET-4)
        run: |
          python prototype/momo_daily.py --out prototype/output

      - name: 打包成静态站
        run: python prototype/build_static.py --out site

      - name: 提交结果
        run: |
          git config user.name "momo-daily-bot"
          git config user.email "bot@users.noreply.github.com"
          git add site
          if git diff --cached --quiet; then
            echo "今天没有新内容"
          else
            git commit -m "daily: $(date -u +%Y-%m-%d)"
            git push
          fi
